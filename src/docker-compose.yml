services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: skin-service-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    extra_hosts:
      - "localhost:host-gateway"
    networks:
      - skin-service-network
    depends_on:
      postgres:
        condition: service_healthy
      seed:
        condition: service_completed_successfully
      minio:
        condition: service_started
      ml-service:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skin-service-frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ""
      VITE_USE_MOCK_ANALYSIS: "false"
      VITE_PROXY_TARGET: "http://backend:8080"
    depends_on:
      - backend
    networks:
      - skin-service-network

  postgres:
    image: postgres:17.11-alpine3.23
    container_name: skin-service-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - skin-service-network

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.migrate
    container_name: skin-service-migrate
    restart: "no"
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - skin-service-network

  seed:
    build:
      context: ./backend
      dockerfile: Dockerfile.seed
    container_name: skin-service-seed
    restart: "no"
    env_file:
      - .env
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - skin-service-network

  minio:
    image: bitnamilegacy/minio:2025.7.23-debian-12-r5
    container_name: skin-service-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/bitnami/minio/data
    networks:
      - skin-service-network

  ml-service:
    build:
      context: ./ml-service
      dockerfile: Dockerfile
    container_name: skin-service-ml
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MODEL_PATH: models/efficientnet_merged.pth
      MODEL_VERSION: 1.0.0
      API_KEY: ${ML_API_KEY}
    networks:
      - skin-service-network

volumes:
  postgres_data:
  minio_data:

networks:
  skin-service-network:
    driver: bridge